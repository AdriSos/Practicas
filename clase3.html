        <ul class="command-list">
            <li><strong>git reset:</strong> Se utiliza para mover la cabecera (HEAD) a un estado anterior..</li>
            <li><strong>git revert:</strong> Crea un nuevo commit que deshace exactamente los cambios de un commit anterior, pero sin borrar el historial..</li>
